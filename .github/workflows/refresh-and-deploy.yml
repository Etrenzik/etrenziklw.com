name: Refresh data & deploy

on:
  workflow_dispatch: {}
  schedule:
    # NOTE: an earlier version of this polled every 3 hours on game days. CFBD's
    # free API key has a MONTHLY call quota, and that cadence burned through it
    # in about a week (every scheduled run failed with 429 "Monthly call quota
    # exceeded" from 2026-09-11 through 2026-09-17 before this was caught) — so
    # "more often" is not actually better here. Once a day is what "daily" in
    # the original spec meant, and it comfortably fits the quota.
    #
    # 13:00 UTC (~8-9am ET) lands after the previous day's games have finished
    # and CFBD has ingested final scores, and after sportsbooks' overnight line
    # moves — so each run picks up fresh results and a reasonably current
    # spread without needing multiple calls a day.
    - cron: "0 13 * 8-12,1 *" # daily during the season (Aug-Dec, Jan)
    - cron: "0 13 * 2-7 0" # weekly (Sundays) in the off-season (Feb-Jul)
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap calibration + backtest (first run only)
        run: |
          if [ ! -f data/calibration.json ]; then
            echo "No calibration on disk yet — fitting the market model and running the backtest."
            npm run calibrate
            npm run backtest
          else
            echo "data/calibration.json already present, skipping calibrate+backtest."
          fi

      - name: Fetch current season data
        run: npm run fetch

      - name: Compute picks + dashboard stats
        run: npm run compute

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh CFBD data [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push
          fi

      - name: Build static site
        run: npm run build

      - name: Ensure Cloudflare Pages project exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create the-spread-cfb --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=the-spread-cfb --branch=main --commit-dirty=true
