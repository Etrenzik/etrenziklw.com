name: Refresh data & deploy

on:
  workflow_dispatch: {}
  schedule:
    # Timing is tied to when CFBD's own upstream sources actually move, not an
    # arbitrary fixed time:
    #  - FBS games are played Thu/Fri/Sat/Sun. Sportsbooks keep adjusting
    #    spreads right up to kickoff (the "closing line" is the most
    #    predictive one), and CFBD ingests final scores within a couple
    #    hours of a game ending. So on game days we poll every 3 hours,
    #    which both tracks late line movement into each kickoff and picks
    #    up finished games same-day instead of waiting for a next-day run.
    - cron: "0 */3 * 8-12,1 0,4-6"
    # - Mon/Tue/Wed are "line-setting" days — books post/refine the coming
    #   week's numbers but nothing is kicking off, so once a day is enough.
    - cron: "0 13 * 8-12,1 1-3"
    # Off-season (Feb-Jul): nothing to track, so just a weekly Sunday check.
    - cron: "0 13 * 2-7 0"
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap calibration + backtest (first run only)
        run: |
          if [ ! -f data/calibration.json ]; then
            echo "No calibration on disk yet — fitting the market model and running the backtest."
            npm run calibrate
            npm run backtest
          else
            echo "data/calibration.json already present, skipping calibrate+backtest."
          fi

      - name: Fetch current season data
        run: npm run fetch

      - name: Compute picks + dashboard stats
        run: npm run compute

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh CFBD data [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push
          fi

      - name: Build static site
        run: npm run build

      - name: Ensure Cloudflare Pages project exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create the-spread-cfb --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=the-spread-cfb --branch=main --commit-dirty=true
