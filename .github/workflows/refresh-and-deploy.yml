name: Refresh data & deploy

on:
  workflow_dispatch:
    inputs:
      rebuild_backtest:
        description: "Re-run the historical backtest (after a model change)"
        type: boolean
        default: false
  schedule:
    # NOTE: an earlier version of this polled every 3 hours on game days. CFBD's
    # free API key has a MONTHLY call quota, and that cadence burned through it
    # in about a week (every scheduled run failed with 429 "Monthly call quota
    # exceeded" from 2026-09-11 through 2026-09-17 before this was caught).
    # Since then the key was upgraded to CFBD's Tier 2 (30,000 calls/month), and
    # the per-run turnover-stats fetch was made incremental (fetchSeason.ts) —
    # a daily run costs only a handful of calls now, comfortably within quota.
    #
    # 13:00 UTC (~8-9am ET) lands after the previous day's games have finished
    # and CFBD has ingested final scores, and after sportsbooks' overnight line
    # moves — so each run picks up fresh results and a reasonably current
    # spread.
    - cron: "0 13 * 8-12,1 *" # daily during the season (Aug-Dec, Jan)
    - cron: "0 13 * 2-7 0" # weekly (Sundays) in the off-season (Feb-Jul)
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out main's tip as of when the job starts, not the commit the run
          # was queued from — otherwise a run queued behind another (concurrency
          # serializes them) regenerates data on a stale base and its commit
          # conflicts with the data the earlier run just pushed.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Calibration + backtest (first run, or on request)
        run: |
          if [ ! -f data/calibration.json ]; then
            echo "No CFB calibration on disk yet — fitting the market model and running the backtest."
            npm run calibrate
            npm run backtest
          elif [ "${{ inputs.rebuild_backtest }}" = "true" ]; then
            echo "Rebuilding the CFB backtest on request."
            npm run backtest
          else
            echo "data/calibration.json already present, skipping CFB calibrate+backtest."
          fi

      - name: NFL calibration + backtest (first run, or on request)
        run: |
          if [ ! -f data/nfl/calibration.json ]; then
            echo "No NFL calibration on disk yet — fitting the market model and running the backtest."
            npm run calibrate:nfl
            npm run backtest:nfl
          elif [ "${{ inputs.rebuild_backtest }}" = "true" ]; then
            echo "Rebuilding the NFL backtest on request."
            npm run backtest:nfl
          else
            echo "data/nfl/calibration.json already present, skipping NFL calibrate+backtest."
          fi

      - name: Fetch current season data (CFB)
        run: npm run fetch

      - name: Compute picks + dashboard stats (CFB)
        run: npm run compute

      # nflverse is a static CSV on GitHub with no API key and no call quota, so
      # unlike the CFB fetch this has no quota-exhaustion path to tolerate. A
      # failure here is a real failure and should surface.
      - name: Fetch current season data (NFL)
        run: npm run fetch:nfl

      - name: Compute picks + dashboard stats (NFL)
        run: npm run compute:nfl

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh CFB + NFL data [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push
          fi

      - name: Build static site
        run: npm run build

      - name: Ensure Cloudflare Pages project exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create the-spread-cfb --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=the-spread-cfb --branch=main --commit-dirty=true
