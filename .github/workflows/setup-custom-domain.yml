name: Attach custom domain to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain to attach to the the-spread-cfb Pages project"
        required: true
        default: "EtrenzikLW.com"
      create_dns_record:
        description: "Also create the apex CNAME record (only proceeds if the zone has zero existing DNS records)"
        type: boolean
        required: true
        default: false

jobs:
  attach-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Add custom domain
        run: |
          set -e
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/the-spread-cfb/domains" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"${{ inputs.domain }}\"}")
          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)
          echo "HTTP status: $STATUS"
          echo "$BODY"
          echo "$BODY" > domain-add-response.json

      - name: Check current domain status
        if: always()
        run: |
          curl -s \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/the-spread-cfb/domains/${{ inputs.domain }}" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | tee domain-status-response.json

      - name: List existing DNS records for the zone (read-only)
        if: always()
        run: |
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=${{ inputs.domain }}" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | tee zone-lookup-response.json | \
            node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);console.log(j.result?.[0]?.id ?? '')})")
          echo "Zone ID: $ZONE_ID"
          echo "ZONE_ID=$ZONE_ID" >> "$GITHUB_ENV"
          if [ -n "$ZONE_ID" ]; then
            curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?per_page=100" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | tee dns-records-response.json
          fi

      # Only runs when the zone has zero existing DNS records, so this can never
      # overwrite/collide with something already pointed at the domain (email, etc).
      - name: Create CNAME record if the zone is empty
        if: inputs.create_dns_record == 'true'
        run: |
          COUNT=$(node -e "const j=require('./dns-records-response.json');console.log(j.result.length)")
          echo "Existing record count: $COUNT"
          if [ "$COUNT" != "0" ]; then
            echo "Zone already has DNS records — refusing to auto-create, handle manually."
            exit 1
          fi
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"type":"CNAME","name":"@","content":"the-spread-cfb.pages.dev","proxied":true}' | tee dns-create-response.json

      - name: Upload responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-setup-responses
          path: |
            domain-add-response.json
            domain-status-response.json
            zone-lookup-response.json
            dns-records-response.json
            dns-create-response.json
